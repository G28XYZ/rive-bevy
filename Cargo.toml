[package]
name = "rive-bevy"
description = "Rive Bevy plugin"
version = "0.1.0"
edition = "2021"
authors = ["Dragoș Tiselice <dragos@rive.app>"]
homepage = "https://rive.app/"
repository = "https://github.com/G28XYZ/rive-bevy"
documentation = "https://help.rive.app/game-runtimes/bevy"
keywords = ["rive", "bevy", "plugin", "ui", "animation"]
categories = ["game-development"]
license = "MIT"
readme = "README.md"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["2d", "3d", "png", "multi_threaded"] }
thiserror = "2"
rive-rs = { git = "https://github.com/G28XYZ/rive-rs", rev = "d4bab8cf7b91469cb48994e1a2dcd77037bd012d", default-features = false, features = ["vello", "text"] }
vello = "=0.10.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
